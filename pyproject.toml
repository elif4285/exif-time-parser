[project]
name = "exif-time-parser"
version = "0.1.1"
description = "Parses and normalizes EXIF date-time strings from image metadata."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
